<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Assistant</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #07101d;
    color: #f1f5f9;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

h1 {
    margin-bottom: 3px;
}

.subtitle {
    color: #94a3b8;
    font-size: 13px;
}

.panel {
    background: #111c2e;
    border: 1px solid #293b58;
    border-radius: 16px;
    padding: 15px;
    margin-top: 12px;
}

.title {
    font-weight: bold;
    margin-bottom: 10px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
}

.board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
}

label {
    display: block;
    color: #94a3b8;
    font-size: 12px;
    margin-bottom: 5px;
}

select,
input,
button {
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid #354968;
    background: #0b1525;
    color: white;
    font-size: 15px;
}

button {
    cursor: pointer;
}

button:hover {
    background: #172943;
}

.row {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.row button {
    width: auto;
    flex: 1;
}

.active {
    outline: 2px solid #60a5fa;
}

.actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.action {
    text-align: center;
    font-weight: 900;
    font-size: 28px;
    padding: 20px 5px;
    background: #192942;
    border-radius: 14px;
}

.metrics {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 10px;
}

.metric {
    background: #0b1525;
    border-radius: 11px;
    padding: 10px;
}

.metric small {
    color: #94a3b8;
}

.metric strong {
    display: block;
    font-size: 19px;
    margin-top: 3px;
}

.info {
    color: #94a3b8;
    font-size: 13px;
    line-height: 1.5;
}

.reset {
    margin-top: 12px;
}

@media (max-width: 650px) {

    .metrics {
        grid-template-columns: repeat(2, 1fr);
    }

    .actions {
        grid-template-columns: 1fr;
    }

    .action {
        font-size: 25px;
        padding: 15px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>♠ Poker Assistant</h1>
<div class="subtitle">
Rychlý Texas Hold'em analyzátor
</div>

<!-- KARTY -->
<div class="panel">

<div class="title">Tvoje karty</div>

<div class="grid">

<div>
<label>Karta 1</label>
<select id="card1"></select>
</div>

<div>
<label>Karta 2</label>
<select id="card2"></select>
</div>

</div>

<div class="title" style="margin-top:15px">
Board
</div>

<div class="board">

<select id="flop1"></select>
<select id="flop2"></select>
<select id="flop3"></select>
<select id="turn"></select>
<select id="river"></select>

</div>

</div>


<!-- SITUACE -->
<div class="panel">

<div class="title">Herní situace</div>

<div class="grid">

<div>
<label>Počet soupeřů</label>
<input id="players" type="number" min="1" max="8" value="1">
</div>

<div>
<label>Pot</label>
<input id="pot" type="number" min="0" value="100">
</div>

<div>
<label>Částka k dorovnání</label>
<input id="call" type="number" min="0" value="50">
</div>

<div>
<label>Tvůj stack</label>
<input id="stack" type="number" min="1" value="500">
</div>

</div>

<br>

<label>Pozice</label>

<div class="row" id="positions"></div>

<br>

<label>Odhad soupeřova range</label>

<div class="row" id="ranges"></div>

</div>


<!-- VÝSLEDEK -->
<div class="panel">

<div class="actions">

<div id="fold" class="action">
FOLD
</div>

<div id="callAction" class="action">
CALL
</div>

<div id="raise" class="action">
RAISE
</div>

</div>


<div class="metrics">

<div class="metric">
<small>Equity</small>
<strong id="equity">—</strong>
</div>

<div class="metric">
<small>Pot odds</small>
<strong id="potOdds">—</strong>
</div>

<div class="metric">
<small>EV call</small>
<strong id="ev">—</strong>
</div>

<div class="metric">
<small>Handa</small>
<strong id="hand">—</strong>
</div>

<div class="metric">
<small>Outs</small>
<strong id="outs">—</strong>
</div>

</div>

<p id="message" class="info">
Zadej svoje dvě karty.
</p>

</div>


<!-- PRE-FLOP -->
<div class="panel">

<div class="title">
Preflop analýza
</div>

<div id="preflop" class="info">
—
</div>

</div>


<button class="reset" onclick="resetApp()">
RESET HANDY
</button>

</div>


<script>

const ranks = "23456789TJQKA";
const suits = "cdhs";

const suitSymbols = {
    c: "♣",
    d: "♦",
    h: "♥",
    s: "♠"
};

const deck = [];

for (const r of ranks) {
    for (const s of suits) {
        deck.push(r + s);
    }
}


const cardIds = [
    "card1",
    "card2",
    "flop1",
    "flop2",
    "flop3",
    "turn",
    "river"
];


const positions = [
    "UTG",
    "HJ",
    "CO",
    "BTN",
    "SB",
    "BB"
];


let selectedPosition = "BTN";
let selectedRange = "standard";
let calculationTimer;


/* -----------------------------
   NASTAVENÍ KARET
----------------------------- */

function setupCards() {

    for (const id of cardIds) {

        const select = document.getElementById(id);

        select.innerHTML =
            '<option value="">—</option>';

        for (const card of deck) {

            const option = document.createElement("option");

            option.value = card;

            option.textContent =
                card[0] + suitSymbols[card[1]];

            select.appendChild(option);
        }

        select.addEventListener(
            "change",
            calculate
        );
    }
}


/* -----------------------------
   POZICE
----------------------------- */

function setupPositions() {

    const container =
        document.getElementById("positions");

    positions.forEach(position => {

        const button =
            document.createElement("button");

        button.textContent = position;

        if (position === selectedPosition) {
            button.classList.add("active");
        }

        button.onclick = () => {

            selectedPosition = position;

            document
                .querySelectorAll("#positions button")
                .forEach(b =>
                    b.classList.remove("active")
                );

            button.classList.add("active");

            calculate();
        };

        container.appendChild(button);
    });
}


/* -----------------------------
   RANGE
----------------------------- */

function setupRanges() {

    const container =
        document.getElementById("ranges");

    ["tight", "standard", "wide"].forEach(range => {

        const button =
            document.createElement("button");

        button.textContent = range;

        if (range === selectedRange) {
            button.classList.add("active");
        }

        button.onclick = () => {

            selectedRange = range;

            document
                .querySelectorAll("#ranges button")
                .forEach(b =>
                    b.classList.remove("active")
                );

            button.classList.add("active");

            calculate();
        };

        container.appendChild(button);
    });
}


/* -----------------------------
   HODNOTA KARTY
----------------------------- */

function cardValue(card) {

    return ranks.indexOf(card[0]) + 2;
}


/* -----------------------------
   POROVNÁNÍ HAND
----------------------------- */

function compareHands(a, b) {

    const length =
        Math.max(a.length, b.length);

    for (let i = 0; i < length; i++) {

        const x = a[i] || 0;
        const y = b[i] || 0;

        if (x !== y) {
            return x - y;
        }
    }

    return 0;
}


/* -----------------------------
   VYHODNOCENÍ 5 KARET
----------------------------- */

function evaluateFive(cards) {

    const values =
        cards
            .map(cardValue)
            .sort((a,b) => b-a);

    const counts = {};

    values.forEach(value => {
        counts[value] =
            (counts[value] || 0) + 1;
    });

    let unique =
        [...new Set(values)]
        .sort((a,b) => b-a);

    if (unique.includes(14)) {
        unique.push(1);
    }

    let straight = 0;

    for (
        let i = 0;
        i <= unique.length - 5;
        i++
    ) {

        if (
            unique[i] -
            unique[i+4] === 4
        ) {

            straight = unique[i];
            break;
        }
    }


    const flush =
        cards.every(
            card =>
                card[1] === cards[0][1]
        );


    const groups =
        Object.entries(counts)
        .map(([value,count]) =>
            [+value,count]
        )
        .sort(
            (a,b) =>
                b[1]-a[1] ||
                b[0]-a[0]
        );


    if (flush && straight)
        return [8, straight];

    if (groups[0][1] === 4)
        return [7, groups[0][0]];

    if (
        groups[0][1] === 3 &&
        groups[1]?.[1] === 2
    )
        return [6, groups[0][0]];

    if (flush)
        return [5, ...values];

    if (straight)
        return [4, straight];

    if (groups[0][1] === 3)
        return [3, groups[0][0]];

    if (
        groups[0][1] === 2 &&
        groups[1]?.[1] === 2
    )
        return [
            2,
            groups[0][0],
            groups[1][0]
        ];

    if (groups[0][1] === 2)
        return [1, groups[0][0]];

    return [0, ...values];
}


/* -----------------------------
   7 KARET
----------------------------- */

function evaluateSeven(cards) {

    let best = null;

    for (let a=0;a<cards.length-4;a++) {
        for (let b=a+1;b<cards.length-3;b++) {
            for (let c=b+1;c<cards.length-2;c++) {
                for (let d=c+1;d<cards.length-1;d++) {
                    for (let e=d+1;e<cards.length;e++) {

                        const result =
                            evaluateFive([
                                cards[a],
                                cards[b],
                                cards[c],
                                cards[d],
                                cards[e]
                            ]);

                        if (
                            !best ||
                            compareHands(
                                result,
                                best
                            ) > 0
                        ) {
                            best = result;
                        }
                    }
                }
            }
        }
    }

    return best;
}


/* -----------------------------
   SHUFFLE
----------------------------- */

function shuffle(array) {

    const result =
        array.slice();

    for (
        let i=result.length-1;
        i>0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [
            result[i],
            result[j]
        ] = [
            result[j],
            result[i]
        ];
    }

    return result;
}


/* -----------------------------
   HAND NÁZVY
----------------------------- */

const handNames = [
    "High card",
    "Pair",
    "Two pair",
    "Three of a kind",
    "Straight",
    "Flush",
    "Full house",
    "Four of a kind",
    "Straight flush"
];


/* -----------------------------
   PREFLOP SÍLA
----------------------------- */

function preflopStrength(cards) {

    if (cards.length < 2)
        return 0;

    const a =
        cardValue(cards[0]);

    const b =
        cardValue(cards[1]);

    const high =
        Math.max(a,b);

    const low =
        Math.min(a,b);

    const pair =
        a === b;

    const suited =
        cards[0][1] ===
        cards[1][1];

    const close =
        high-low <= 2;

    let score = 0;

    if (pair)
        score += 0.55;

    score +=
        high / 14 * 0.22;

    score +=
        low / 14 * 0.12;

    if (suited)
        score += 0.06;

    if (close)
        score += 0.05;

    return Math.min(
        0.95,
        score
    );
}


/* -----------------------------
   SIMULACE EQUITY
----------------------------- */

function simulateEquity(
    hero,
    board,
    players
) {

    const used =
        new Set(
            hero.concat(board)
        );

    const remaining =
        deck.filter(
            card =>
                !used.has(card)
        );

    let wins = 0;
    let ties = 0;

    const simulations =
        1200;

    for (
        let i=0;
        i<simulations;
        i++
    ) {

        const shuffled =
            shuffle(remaining);

        const needed =
            5-board.length;

        const finalBoard =
            board.concat(
                shuffled.slice(
                    0,
                    needed
                )
            );

        let index = needed;

        const heroHand =
            evaluateSeven(
                hero.concat(finalBoard)
            );

        let lost = false;
        let tied = false;

        for (
            let player=1;
            player<players;
            player++
        ) {

            const opponent =
                shuffled.slice(
                    index,
                    index+2
                );

            index += 2;

            const opponentHand =
                evaluateSeven(
                    opponent.concat(
                        finalBoard
                    )
                );

            const comparison =
                compareHands(
                    heroHand,
                    opponentHand
                );

            if (comparison < 0) {
                lost = true;
                break;
            }

            if (comparison === 0) {
                tied = true;
            }
        }

        if (!lost) {

            if (tied)
                ties++;
            else
                wins++;
        }
    }

    return (
        wins +
        ties * 0.5
    ) / simulations;
}


/* -----------------------------
   HLAVNÍ ANALÝZA
----------------------------- */

function calculate() {

    clearTimeout(
        calculationTimer
    );

    calculationTimer =
        setTimeout(() => {

            const hero = [
                document.getElementById(
                    "card1"
                ).value,

                document.getElementById(
                    "card2"
                ).value
            ].filter(Boolean);


            const boardIds = [
                "flop1",
                "flop2",
                "flop3",
                "turn",
                "river"
            ];

            const board =
                boardIds
                .map(id =>
                    document.getElementById(
                        id
                    ).value
                )
                .filter(Boolean);


            if (hero.length < 2) {

                document.getElementById(
                    "message"
                ).textContent =
                    "Zadej dvě svoje karty.";

                return;
            }


            const allCards =
                hero.concat(board);

            const unique =
                new Set(allCards);

            if (
                unique.size !==
                allCards.length
            ) {

                document.getElementById(
                    "message"
                ).textContent =
                    "Pozor, stejnou kartu používáš vícekrát.";

                return;
            }


            const players =
                Math.max(
                    1,
                    Number(
                        document.getElementById(
                            "players"
                        ).value
                    ) || 1
                );


            const pot =
                Math.max(
                    0,
                    Number(
                        document.getElementById(
                            "pot"
                        ).value
                    ) || 0
                );


            const call =
                Math.max(
                    0,
                    Number(
                        document.getElementById(
                            "call"
                        ).value
                    ) || 0
                );


            let equity;


            if (board.length >= 3) {

                equity =
                    simulateEquity(
                        hero,
                        board,
                        players
                    );

            } else {

                equity =
                    preflopStrength(
                        hero
                    );
            }


            const potOdds =
                call > 0
                ? call /
                  (pot + call)
                : 0;


            const ev =
                equity *
                (pot + call) -
                call;


            let action;


            if (call === 0) {

                if (equity > 0.55)
                    action = "RAISE";

                else if (equity > 0.32)
                    action = "CALL";

                else
                    action = "FOLD";

            } else {

                if (
                    equity >
                    potOdds + 0.10
                ) {

                    action = "RAISE";

                } else if (
                    equity >= potOdds
                ) {

                    action = "CALL";

                } else {

                    action = "FOLD";
                }
            }


            document.getElementById(
                "equity"
            ).textContent =
                (equity*100)
                .toFixed(1) + "%";


            document.getElementById(
                "potOdds"
            ).textContent =
                (potOdds*100)
                .toFixed(1) + "%";


            document.getElementById(
                "ev"
            ).textContent =
                (ev >= 0 ? "+" : "") +
                ev.toFixed(1);


            let handName =
                "Preflop";


            if (board.length >= 3) {

                const result =
                    evaluateSeven(
                        hero.concat(
                            board
                        )
                    );

                handName =
                    handNames[
                        result[0]
                    ];
            }


            document.getElementById(
                "hand"
            ).textContent =
                handName;


            document.getElementById(
                "outs"
            ).textContent =
                "—";


            [
                "fold",
                "callAction",
                "raise"
            ].forEach(id => {

                document.getElementById(
                    id
                ).style.outline =
                    "none";
            });


            const actionMap = {
                FOLD: "fold",
                CALL: "callAction",
                RAISE: "raise"
            };


            document.getElementById(
                actionMap[action]
            ).style.outline =
                "3px solid #60a5fa";


            document.getElementById(
                "message"
            ).textContent =
                `Pozice: ${selectedPosition}. ` +
                `Range soupeře: ${selectedRange}. ` +
                `Equity je orientační simulace ` +
                `pro analýzu a trénink.`;



            const strength =
                preflopStrength(
                    hero
                );


            document.getElementById(
                "preflop"
            ).textContent =
                `Orientační preflop síla: ` +
                `${(strength*100).toFixed(0)} %. ` +
                (hero[0][0] === hero[1][0]
                    ? "Máš pár. "
                    : "") +
                (hero[0][1] === hero[1][1]
                    ? "Suited. "
                    : "") +
                (Math.abs(
                    cardValue(hero[0]) -
                    cardValue(hero[1])
                ) <= 2
                    ? "Karty jsou blízko u sebe."
                    : "");

        }, 0);
}


/* -----------------------------
   RESET
----------------------------- */

function resetApp() {

    cardIds.forEach(id => {

        document.getElementById(
            id
        ).value = "";
    });


    document.getElementById(
        "players"
    ).value = 1;


    document.getElementById(
        "pot"
    ).value = 100;


    document.getElementById(
        "call"
    ).value = 50;


    document.getElementById(
        "stack"
    ).value = 500;


    calculate();
}


/* START */

setupCards();
setupPositions();
setupRanges();
calculate();

</script>

</body>
</html>
