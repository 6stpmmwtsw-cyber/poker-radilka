<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poker Assistant Pro</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0b0b; color: #fff; overflow: hidden; }
        
        #camera-feed { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.25; }
        
        .app-container { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }

        /* Top Navigation Tabs */
        .nav-tabs { display: flex; background: rgba(20,20,20,0.85); padding: 5px; border-radius: 12px; backdrop-filter: blur(10px); gap: 5px; border: 1px solid rgba(255,255,255,0.1); }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #aaa; font-weight: bold; border-radius: 8px; font-size: 13px; text-align: center; }
        .tab-btn.active { background: #007aff; color: #fff; }

        /* Content Sections */
        .section { display: none; flex: 1; flex-direction: column; justify-content: center; gap: 12px; }
        .section.active { display: flex; }

        /* Decision Box */
        .decision-card { background: rgba(18, 18, 18, 0.9); border-radius: 18px; padding: 18px; text-align: center; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .action-title { font-size: 34px; font-weight: 900; margin: 5px 0; text-transform: uppercase; letter-spacing: 1px; }
        .action-fold { color: #ff4d4d; text-shadow: 0 0 15px rgba(255,77,77,0.4); }
        .action-call { color: #2ecc71; text-shadow: 0 0 15px rgba(46,204,113,0.4); }
        .action-raise { color: #f1c40f; text-shadow: 0 0 15px rgba(241,196,15,0.4); }

        /* Grid */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .grid-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.03); }
        .stat-label { font-size: 10px; color: #aaa; text-transform: uppercase; margin-bottom: 2px; }
        .grid-val { font-size: 18px; font-weight: bold; }

        /* Settings & Manual Inputs */
        .settings-card { background: rgba(18, 18, 18, 0.9); border-radius: 18px; padding: 15px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .setting-row:last-child { border-bottom: none; }
        .setting-row span { font-size: 14px; color: #ddd; }
        .setting-select { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 8px; font-size: 14px; }

        /* Bottom Controls */
        .controls { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 14px; border: none; border-radius: 12px; background: #222; color: white; font-weight: bold; font-size: 14px; border: 1px solid rgba(255,255,255,0.1); }
        .btn-primary { background: #007aff; border: none; }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline></video>

    <div class="app-container">
        <!-- Hlavní menu (přepínání záložek) -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('live', this)">🎥 Semafor</button>
            <button class="tab-btn" onclick="switchTab('calc', this)">📊 Kalkulačka</button>
            <button class="tab-btn" onclick="switchTab('settings', this)">⚙️ Nastavení</button>
        </div>

        <!-- SEKCE 1: Živý přehled / Semafor -->
        <div id="section-live" class="section active">
            <div class="decision-card">
                <div class="stat-label">Doporučená Akce</div>
                <div id="action-text" class="action-title action-call">RAISE 2.5x</div>
                
                <div class="stats-grid">
                    <div class="grid-item">
                        <div class="stat-label">Šance na výhru</div>
                        <div id="win-rate" class="grid-val" style="color: #00ff88;">64.2%</div>
                    </div>
                    <div class="grid-item">
                        <div class="stat-label">Očekávaná hodnota</div>
                        <div id="ev-val" class="grid-val" style="color: #00ff88;">+3.2 BB</div>
                    </div>
                    <div class="grid-item">
                        <div class="stat-label">Pot Odds</div>
                        <div class="grid-val">33% (2:1)</div>
                    </div>
                    <div class="grid-item">
                        <div class="stat-label">Detekované karty</div>
                        <div id="cards-val" class="grid-val" style="color: #f1c40f;">A♠ K♠</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SEKCE 2: Rychlá kalkulačka / Změna situace -->
        <div id="section-calc" class="section">
            <div class="settings-card">
                <h3 style="margin-top:0; font-size:16px; color:#007aff;">Rychlý přepočet situace</h3>
                <div style="font-size: 13px; color: #aaa; margin-bottom: 12px;">Klepnutím na tlačítko níže nasimuluješ novou handu ze stolu.</div>
                <button class="btn btn-primary" style="width:100%;" onclick="recalculate()">🎲 Načíst novou handu</button>
            </div>
        </div>

        <!-- SEKCE 3: Nastavení hry -->
        <div id="section-settings" class="section">
            <div class="settings-card">
                <div class="setting-row">
                    <span>Formát stolu</span>
                    <select class="setting-select">
                        <option>6-Max (Standard)</option>
                        <option>Full Ring (9-Max)</option>
                        <option>Heads-Up (1v1)</option>
                    </select>
                </div>
                <div class="setting-row">
                    <span>Tvoje pozice</span>
                    <select class="setting-select">
                        <option>BTN (Dealer)</option>
                        <option>CO (Cutoff)</option>
                        <option>MP (Middle)</option>
                        <option>UTG</option>
                        <option>SB / BB</option>
                    </select>
                </div>
                <div class="setting-row">
                    <span>Hloubka stacku</span>
                    <select class="setting-select">
                        <option>100 BB</option>
                        <option>50 BB</option>
                        <option>20 BB (Short)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Spodní ovládací lišta -->
        <div class="controls">
            <button class="btn" onclick="toggleCamera()">👁️ Skrýt/Ukázat kameru</button>
            <button class="btn btn-primary" onclick="recalculate()">🔄 Aktualizovat</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera-feed');
        
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" },
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                console.log("Kamera vypnuta.");
            }
        }

        function toggleCamera() {
            video.style.opacity = video.style.opacity === "0" ? "0.25" : "0";
        }

        function switchTab(tabName, element) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('section-' + tabName).classList.add('active');
            element.classList.add('active');
        }

        function recalculate() {
            const winRates = ["31.4%", "48.9%", "64.2%", "82.5%"];
            const evVals = ["-1.2 BB", "+0.4 BB", "+3.2 BB", "+7.8 BB"];
            const actions = [
                { text: "FOLD", class: "action-fold" },
                { text: "CALL", class: "action-call" },
                { text: "RAISE 2.5x", class: "action-raise" },
                { text: "ALL-IN", class: "action-raise" }
            ];
            const cards = ["72 off", "QJ suiter", "A♠ K♠", "Pocket Aces"];

            const rand = Math.floor(Math.random() * actions.length);
            
            document.getElementById('win-rate').innerText = winRates[rand];
            document.getElementById('ev-val').innerText = evVals[rand];
            document.getElementById('action-text').innerText = actions[rand].text;
            document.getElementById('action-text').className = "action-title " + actions[rand].class;
            document.getElementById('cards-val').innerText = cards[rand];
        }

        startCamera();
    </script>
</body>
</html>
