<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poker Assistant</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .header { padding: 15px; text-align: center; font-size: 20px; font-weight: bold; background: #111; }
        .main-display { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .action-box { font-size: 40px; font-weight: 900; margin-bottom: 20px; text-transform: uppercase; }
        .stats { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat { text-align: center; }
        .stat-val { font-size: 24px; font-weight: bold; color: #007aff; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; padding: 10px; }
        button { padding: 15px; border-radius: 10px; border: none; background: #222; color: #fff; font-weight: bold; font-size: 14px; }
        button:active { background: #007aff; }
    </style>
</head>
<body>
    <div class="header">RUČNÍ VÝBĚR KARET</div>
    <div class="main-display">
        <div id="action" class="action-box">VYBER KARTU</div>
        <div class="stats">
            <div class="stat"><div class="stat-val" id="win">--</div>Šance</div>
            <div class="stat"><div class="stat-val" id="ev">--</div>EV</div>
        </div>
        <div class="grid">
            <button onclick="update('AA', '85%', '+8 BB', 'RAISE')">AA</button>
            <button onclick="update('KK', '82%', '+7 BB', 'RAISE')">KK</button>
            <button onclick="update('QQ', '79%', '+6 BB', 'RAISE')">QQ</button>
            <button onclick="update('JJ', '75%', '+5 BB', 'RAISE')">JJ</button>
            <button onclick="update('AKs', '67%', '+4 BB', 'RAISE')">AKs</button>
            <button onclick="update('AKo', '65%', '+3 BB', 'RAISE')">AKo</button>
            <button onclick="update('AQs', '65%', '+3 BB', 'CALL')">AQs</button>
            <button onclick="update('TT', '71%', '+3 BB', 'CALL')">TT</button>
            <button onclick="update('99', '67%', '+2 BB', 'CALL')">99</button>
            <button onclick="update('88', '63%', '+1 BB', 'CALL')">88</button>
            <button onclick="update('77', '59%', '+0 BB', 'CALL')">77</button>
            <button onclick="update('72o', '32%', '-2 BB', 'FOLD')">72o</button>
        </div>
    </div>
    <script>
        function update(cards, win, ev, action) {
            document.getElementById('action').innerText = action;
            document.getElementById('win').innerText = win;
            document.getElementById('ev').innerText = ev;
        }
    </script>
</body>
</html>
